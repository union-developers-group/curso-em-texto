pre-commit:
  parallel: true
  commands:
    linter:
      run: npx turbo run lint --output-logs=errors-only --filter=...[HEAD]
      stage_fixed: true
    format:
      run: npx prettier --write --ignore-unknown --log-level=warn {staged_files}
      stage_fixed: true
    test:
      run: npx turbo run test:staged --filter=...[HEAD]

commit-msg:
  commands:
    lint-commit-msg:
      run: npx commitlint --edit $1

pre-push:
  parallel: false
  commands:
    test:
      run: npx turbo run test:ci --filter=...[origin/main]

    typecheck:
      run: npx turbo run typecheck --filter=...[origin/main]

    packages-audit:
      run: npx audit-ci
